name: Build shortlist

on:
  schedule:
    # 12:23 UTC on weekdays. This is 8:23 AM during EDT and 7:23 AM during EST.
    - cron: "23 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shortlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build shortlist
        run: python build_shortlist.py

      - name: Commit updated shortlist
        run: |
          git config user.name "shortlist-bot"
          git config user.email "shortlist-bot@users.noreply.github.com"
          git add data/shortlist.json
          git diff --cached --quiet || git commit -m "Update shortlist $(date -u +%F)"
          git push
